<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Intelligence RAG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <h1>Decision Intelligence RAG</h1>

        <div class="upload-container">
            <h3>1. Data Ingestion</h3>
            <label for="file-upload" class="drop-zone" id="drop-zone">
                <span class="drop-zone-text">Drop CSV here or click to upload</span>
                <input type="file" id="file-upload" accept=".csv" hidden>
            </label>
            <button id="ingest-btn" class="ingest-btn">Ingest to Qdrant</button>
            <div id="upload-status" class="status-message"></div>
        </div>

        <div class="query-container">
            <h3>2. Ask your Data</h3>
            <textarea id="query-input" placeholder="e.g. Which product had the highest sales growth?"></textarea>
            <button id="query-btn" class="ingest-btn">Ask AI</button>

            <div id="answer-container" class="answer-box" style="display: none;">
                <strong>AI Answer:</strong>
                <p id="answer-text"></p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const dropZoneText = document.querySelector('.drop-zone-text');
        const ingestBtn = document.getElementById('ingest-btn');
        const uploadStatus = document.getElementById('upload-status');

        const queryInput = document.getElementById('query-input');
        const queryBtn = document.getElementById('query-btn');
        const answerContainer = document.getElementById('answer-container');
        const answerText = document.getElementById('answer-text');

        // Update UI when file is selected
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                dropZoneText.innerText = `Selected: ${fileInput.files[0].name}`;
            }
        });

        // 1. Handle Ingestion
        ingestBtn.addEventListener('click', async () => {
            if (!fileInput.files.length) return alert("Please select a file first");

            ingestBtn.disabled = true;
            ingestBtn.innerText = "Ingesting...";
            uploadStatus.innerText = "Processing CSV and generating embeddings...";

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/ingest', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                uploadStatus.innerText = result.message || result.status;
            } catch (err) {
                uploadStatus.innerText = "Upload failed. Check console.";
                console.error(err);
            } finally {
                ingestBtn.disabled = false;
                ingestBtn.innerText = "Ingest to Qdrant";
            }
        });

        // 2. Handle Query
        queryBtn.addEventListener('click', async () => {
            const prompt = queryInput.value;
            if (!prompt) return alert("Please enter a question");

            queryBtn.disabled = true;
            queryBtn.innerText = "Thinking...";
            answerContainer.style.display = 'none';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const result = await response.json();

                answerContainer.style.display = 'block';
                answerText.innerText = result.answer;
            } catch (err) {
                alert("Query failed.");
                console.error(err);
            } finally {
                queryBtn.disabled = false;
                queryBtn.innerText = "Ask AI";
            }
        });
    </script>
</body>

</html>
